[package]
name = "los"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.7.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
riscv = "0.11.1"
sbi-rt = { version = "0.0.3", features = ["legacy"] }
spin = "0.9.8"
xmas-elf = "0.9.1"
syscall_spec = { path = "../syscall_spec" }
virtio-drivers = { git = "https://github.com/rcore-os/virtio-drivers", rev = "4ee80e5" }
